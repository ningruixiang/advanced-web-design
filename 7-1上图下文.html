<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上图下文案例</title>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    ul{
        list-style: none;
        display: flex;
        gap: 8px; /* 卡片之间的间隙 */
        padding:10px;
    }
    li{
        width: 32%;
        height: 320px;  /* ✅固定卡片总高度 */
        position: relative;
        overflow:hidden; /* ✅超出部分隐藏 */
    }
    img{
        width: 100%;
        height:100%;    /* ✅图片占满容器 */
        display:block;
        /* object-fit: cover; ✅等比例裁剪图片，不变形，填满盒子 */
        object-fit: contain;
        background:#eee;

    }
    p{
        position: absolute;
        bottom:0;
        left:0;
        width:100%;
        text-align: center;
        padding:8px 0;
        background-color:rgba(0,0,0,0.5);
        color:#fff;
        font-size:16px;
    }
    
</style>
</head>
<body>
    <ul>
        <li>
            <img src="OIP-C (1).png" alt="图片1">
            <p>宁瑞祥的上图下文</p>
        </li>
        <li>
            <img src="OIP-C (2).png" alt="图片2">
            <p>图片2</p>
        </li>
        <li>
            <img src="OIP-C.png" alt="图片3">
            <p>图片3</p>
        </li>
    </ul>
</body>
</html>
