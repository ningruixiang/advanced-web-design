<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS进阶 - 苹果极简风</title>
    <style>
        /* 全局重置，苹果极简：干净、柔和，去除粗黑边框 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #fafafa; /* 苹果经典浅灰白背景 */
            padding: 60px 20px;
        }

        h2,h3,p{
            padding: 20px;
            margin: 20px;
        }
        #box{
            width: 50%;
            margin: 0 auto;
            padding: 36px;
            border: none;
            border-radius: 18px; /* Apple大圆角 */
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); /* 极淡柔和阴影，代替厚重黑阴影 */
            background-color: #ffffff;
            font: 1em sans-serif;
        }
        #box h3{
            font-size: 2em;
            text-align: center;
            line-height: 40px;
            letter-spacing: 2px;
            color: #1d1d1f; /* 苹果正文深灰，不用纯黑 */
        }
        #box p{
            font-size: 1.2em;
            line-height: 1.8; /* 苹果舒适行高 */
            color: #6e6e73;
            text-indent: 2em;
        }
        #box a{
            font-size: 1.2em;
            line-height: 20px;
            color: #007aff; /* Apple链接蓝 */
            text-decoration: none;
            font-weight: 500;
        }
        #box a:hover{
            text-decoration: underline;
        }
        .yname{
            color: #1d1d1f;
            font-weight: 600;
        }
        /* 任务：学号蓝色加粗 */
        .stu-id{
            color:#007aff;
            font-weight: bold;
        }
        /* 任务：难度5星红色加粗 */
        .level{
            color:#ff3b30;
            font-weight: bold;
        }
        /* 任务：知识点紫色边框 */
        .knowledge{
            border:1px solid #af52de;
            padding:2px 6px;
            border-radius:6px;
        }
    </style>
</head>
<body>
    <h2 style="color:#1d1d1f; text-align:center;">css进阶</h2>
    <div id="box">
        <h3>css选择器</h3>
        <p>
            学号：<span class="stu-id">2001010503</span> 姓名：<span class="yname">宁瑞祥</span>，班级：计算机23005，对于《高级网页设计》，课程认知难度：<span class="level">5星</span>
            <br>这个例子对应的<span class="knowledge">知识点：群组选择器，后代选择器、层叠与继承</span>
            <a href="#">点击跳转>></a>
        </p>
        
    </div>
    <!-- 
        任务注释说明：
        学号 蓝色加粗  → class="stu-id"
        姓名：深色加粗 → class="yname"
        难度的值 红色加粗 → class="level"
        知识点,紫色边框 → class="knowledge"，边框为额外内容，使用内部css
        整体采用苹果极简主义：大圆角、低对比度柔和阴影、留白充足、苹方系统无衬线字体、浅白背景，去除厚重黑色边框
    -->
    
</body>
</html>
